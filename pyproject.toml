[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selection-prefix-cache"
version = "0.1.0"
description = "A streaming prototype for compressed sparse selection prefix caches"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
cuda = ["torch>=2.4", "triton>=3.0; platform_system == 'Linux'"]

[tool.setuptools.packages.find]
include = ["selection_cache*"]
